{% extends "base.html" %}{% block content %}<h2>Activity Log</h2><table class="table"><tr><th>Date</th><th>User</th><th>Branch</th><th>Action</th><th>Details</th></tr>{% for x in rows %}<tr><td>{{x.created_at}}</td><td>{{x.user.email if x.user else '-'}}</td><td>{{x.branch.name if x.branch else 'Global'}}</td><td>{{x.action}}</td><td>{{x.details}}</td></tr>{% endfor %}</table>{% endblock %}
