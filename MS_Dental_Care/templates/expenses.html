{% extends "base.html" %}{% block content %}<h2>Expenses</h2>{% if current_user.role!='viewer' %}<form method="post" class="card p-3 mb-3"><div class="row g-2"><div class="col"><input name="expense_date" type="date" value="{{today}}" class="form-control"></div><div class="col"><select name="branch_id" class="form-select">{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></div><div class="col"><input name="category" placeholder="Category" class="form-control"></div><div class="col"><input name="description" placeholder="Description" class="form-control"></div><div class="col"><input name="amount" type="number" step="0.01" placeholder="Amount" class="form-control"></div></div><button class="btn btn-primary mt-2">Save</button></form>{% endif %}<div class="card p-3"><table class="table"><tr><th>Date</th><th>Branch</th><th>Category</th><th>Description</th><th>Amount</th></tr>{% for e in rows %}<tr><td>{{e.expense_date}}</td><td>{{e.branch.name}}</td><td>{{e.category}}</td><td>{{e.description}}</td><td>{{e.amount}}</td></tr>{% endfor %}</table></div>{% endblock %}
