{% extends "base.html" %}{% block content %}<h2>Edit Patient</h2><form method="post" class="card p-4"><input name="name" value="{{p.name}}" class="form-control mb-2"><input name="mobile" value="{{p.mobile}}" class="form-control mb-2"><input name="age" value="{{p.age}}" class="form-control mb-2"><input name="gender" value="{{p.gender}}" class="form-control mb-2"><input name="address" value="{{p.address}}" class="form-control mb-2"><textarea name="medical_history" class="form-control mb-2">{{p.medical_history}}</textarea><button class="btn btn-primary">Update</button></form>{% endblock %}
