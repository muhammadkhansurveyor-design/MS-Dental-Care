{% extends "base.html" %}{% block content %}<h2>Branches</h2><form method="post" class="card p-3 mb-3"><div class="row g-2"><div class="col"><input name="name" placeholder="Branch Name" class="form-control" required></div><div class="col"><input name="country" value="Pakistan" class="form-control"></div><div class="col"><input name="city" placeholder="City" class="form-control"></div><div class="col"><input name="address" placeholder="Address" class="form-control"></div><div class="col"><input name="phone" placeholder="Phone" class="form-control"></div></div><button class="btn btn-primary mt-2">Add Branch</button></form><table class="table"><tr><th>Name</th><th>Country</th><th>City</th><th>Phone</th><th>Status</th><th>Action</th></tr>{% for b in rows %}<tr><td>{{b.name}}</td><td>{{b.country}}</td><td>{{b.city}}</td><td>{{b.phone}}</td><td>{{'Active' if b.active else 'Disabled'}}</td><td class="text-nowrap">{% if current_user.role=="super_admin" %}<a href="{{url_for('branch_edit',bid=b.id)}}" class="btn btn-sm btn-outline-primary">Edit</a> <form method="post" action="{{url_for("delete_record",model="branch",item_id=b.id)}}" class="d-inline" onsubmit="return confirm('Delete this branch and ALL its patients, doctors, staff and records? This cannot be undone.');"><button class="btn btn-sm btn-danger">Delete</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
