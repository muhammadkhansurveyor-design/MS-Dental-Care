{% extends "base.html" %}{% block content %}
<h2>Edit Staff</h2>
<form method="post" class="card p-4"><div class="row g-3">
<div class="col-md-6"><label>Name</label><input name="name" value="{{s.name}}" class="form-control" required></div>
<div class="col-md-6"><label>Role</label><input name="role_name" value="{{s.role_name}}" class="form-control"></div>
<div class="col-md-4"><label>Mobile</label><input name="mobile" value="{{s.mobile}}" class="form-control"></div>
<div class="col-md-4"><label>CNIC/ID</label><input name="cnic" value="{{s.cnic}}" class="form-control"></div>
<div class="col-md-4"><label>Salary</label><input name="salary" type="number" value="{{s.salary}}" class="form-control"></div>
<div class="col-md-6"><label>Branch</label><select name="branch_id" class="form-select">{% for b in branches %}<option value="{{b.id}}" {% if s.branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></div>
<div class="col-md-6"><label>Status</label><select name="active" class="form-select"><option value="1" {% if s.active %}selected{% endif %}>Active</option><option value="0" {% if not s.active %}selected{% endif %}>Disabled</option></select></div>
</div><button class="btn btn-primary mt-4">Save Changes</button> <a href="{{url_for('staff')}}" class="btn btn-outline-secondary mt-4">Cancel</a></form>
{% endblock %}
