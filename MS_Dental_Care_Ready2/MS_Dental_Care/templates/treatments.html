{% extends "base.html" %}{% block content %}<h2>Treatments & Prices</h2><form method="post" class="row g-2 mb-3"><div class="col"><input name="name" placeholder="Treatment" class="form-control"></div><div class="col"><input name="price" type="number" placeholder="Price" class="form-control"></div><div class="col-auto"><button class="btn btn-primary">Save</button></div></form><table class="table"><tr><th>Treatment</th><th>Price</th></tr>{% for t in rows %}<tr><td>{{t.name}}</td><td>{{t.price}}</td></tr>{% endfor %}</table>{% endblock %}
