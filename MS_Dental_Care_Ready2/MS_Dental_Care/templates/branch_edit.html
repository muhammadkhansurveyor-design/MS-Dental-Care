{% extends "base.html" %}{% block content %}
<h2>Edit Branch</h2>
<form method="post" class="card p-4"><div class="row g-3">
<div class="col-md-6"><label>Branch Name</label><input name="name" value="{{b.name}}" class="form-control" required></div>
<div class="col-md-6"><label>Country</label><input name="country" value="{{b.country}}" class="form-control"></div>
<div class="col-md-6"><label>City</label><input name="city" value="{{b.city}}" class="form-control"></div>
<div class="col-md-6"><label>Phone</label><input name="phone" value="{{b.phone}}" class="form-control"></div>
<div class="col-md-12"><label>Address</label><input name="address" value="{{b.address}}" class="form-control"></div>
<div class="col-md-6"><label>Status</label><select name="active" class="form-select"><option value="1" {% if b.active %}selected{% endif %}>Active</option><option value="0" {% if not b.active %}selected{% endif %}>Disabled</option></select></div>
</div><button class="btn btn-primary mt-4">Save Changes</button> <a href="{{url_for('branches')}}" class="btn btn-outline-secondary mt-4">Cancel</a></form>
{% endblock %}
