{% extends "base.html" %}{% block content %}<h2>Salary Management</h2>{% if current_user.role in ['super_admin','branch_admin'] %}<form method="post" class="card p-3 mb-3"><div class="row g-2"><div class="col"><select name="staff_id" class="form-select">{% for s in staffs %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></div><div class="col"><input name="month" placeholder="2026-08" class="form-control"></div><div class="col"><input name="gross_salary" type="number" placeholder="Gross" class="form-control"></div><div class="col"><input name="advance" type="number" value="0" class="form-control"></div><div class="col"><input name="paid" type="number" value="0" class="form-control"></div></div><button class="btn btn-primary mt-2">Save Salary</button></form>{% endif %}<table class="table"><tr><th>Staff</th><th>Month</th><th>Gross</th><th>Advance</th><th>Paid</th><th>Balance</th></tr>{% for x in rows %}<tr><td>{{x.staff.name}}</td><td>{{x.month}}</td><td>{{x.gross_salary}}</td><td>{{x.advance}}</td><td>{{x.paid}}</td><td>{{x.balance}}</td></tr>{% endfor %}</table>{% endblock %}
