services:
  web:
    build: .
    ports: ["8080:8080"]
    environment:
      SECRET_KEY: change-this
      DATABASE_URL: postgresql://msdental:msdental@db:5432/msdental
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: msdental
      POSTGRES_USER: msdental
      POSTGRES_PASSWORD: msdental
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
