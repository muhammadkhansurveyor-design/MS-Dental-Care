{% extends "base.html" %}{% block content %}<h2>Doctors</h2>{% if current_user.role in ['super_admin','branch_admin'] %}<form method="post" class="card p-3 mb-3"><div class="row g-2"><div class="col"><input name="name" placeholder="Doctor Name" class="form-control" required></div><div class="col"><input name="mobile" placeholder="Mobile" class="form-control"></div><div class="col"><select name="branch_id" class="form-select">{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></div></div><button class="btn btn-primary mt-2">Add Doctor</button></form>{% endif %}<table class="table"><tr><th>Name</th><th>Mobile</th><th>Branch</th></tr>{% for d in rows %}<tr><td>{{d.name}}</td><td>{{d.mobile}}</td><td>{{d.branch.name}}</td></tr>{% endfor %}</table>{% endblock %}
