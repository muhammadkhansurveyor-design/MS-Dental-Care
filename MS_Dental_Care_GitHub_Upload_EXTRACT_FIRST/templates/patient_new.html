{% extends "base.html" %}{% block content %}<h2>New Patient + Billing</h2><form method="post" enctype="multipart/form-data" class="card p-4"><div class="row g-3">
<div class="col-md-3"><label>Branch</label><select name="branch_id" class="form-select">{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Name</label><input name="name" class="form-control" required></div><div class="col-md-3"><label>Mobile</label><input name="mobile" class="form-control"></div><div class="col-md-1"><label>Age</label><input name="age" class="form-control"></div><div class="col-md-2"><label>Gender</label><select name="gender" class="form-select"><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="col-md-6"><label>Address</label><input name="address" class="form-control"></div><div class="col-md-6"><label>Medical History</label><input name="medical_history" class="form-control"></div>
<div class="col-md-3"><label>Doctor</label><select name="doctor_id" class="form-select"><option value="">Unassigned</option>{% for d in doctors %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Treatment</label><select id="treat" name="treatment_id" class="form-select"><option value="">Select</option>{% for t in treatments %}<option value="{{t.id}}" data-price="{{t.price}}">{{t.name}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Tooth / Notes</label><input name="tooth_notes" class="form-control"></div><div class="col-md-3"><label>X-Ray / Image</label><input type="file" name="xray" class="form-control"></div>
<div class="col-12"><label>Clinical Notes</label><textarea name="clinical_notes" class="form-control"></textarea></div>
<div class="col-md-3"><label>Total</label><input id="total" name="total" type="number" step="0.01" class="form-control"></div><div class="col-md-3"><label>Discount</label><input name="discount" value="0" type="number" step="0.01" class="form-control"></div><div class="col-md-3"><label>Received</label><input name="received" value="0" type="number" step="0.01" class="form-control"></div><div class="col-md-3"><label>Payment</label><select name="payment_type" class="form-select"><option>Cash</option><option>Partial</option><option>Credit</option><option>Free</option></select></div></div><button class="btn btn-success mt-4">Save Patient & Bill</button></form><script>document.getElementById('treat').onchange=function(){document.getElementById('total').value=this.options[this.selectedIndex].dataset.price||0}</script>{% endblock %}
