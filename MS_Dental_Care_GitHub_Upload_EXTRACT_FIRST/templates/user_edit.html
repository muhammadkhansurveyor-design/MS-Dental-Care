{% extends "base.html" %}{% block content %}
<h2>Edit User</h2><form method="post" class="card p-4"><div class="row g-3">
<div class="col-md-6"><label>Name</label><input name="name" value="{{target.name}}" class="form-control" required></div>
<div class="col-md-6"><label>Email</label><input name="email" type="email" value="{{target.email}}" class="form-control" required></div>
<div class="col-md-6"><label>New Password</label><input name="password" type="password" class="form-control" placeholder="Leave blank to keep existing"></div>
{% if is_self %}<div class="col-md-3"><label>Role</label><input value="super_admin" class="form-control" disabled></div><div class="col-md-3"><label>Status</label><input value="Active" class="form-control" disabled></div>
{% else %}<div class="col-md-3"><label>Role</label><select name="role" class="form-select">{% for r in roles %}<option value="{{r}}" {% if target.role==r %}selected{% endif %}>{{r}}</option>{% endfor %}</select></div>
<div class="col-md-3"><label>Branch</label><select name="branch_id" class="form-select"><option value="">All / None</option>{% for b in branches %}<option value="{{b.id}}" {% if target.branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></div>
<div class="col-md-3"><label>Status</label><select name="active" class="form-select"><option value="1" {% if target.active %}selected{% endif %}>Active</option><option value="0" {% if not target.active %}selected{% endif %}>Disabled</option></select></div>{% endif %}
</div><button class="btn btn-primary mt-4">Save Changes</button></form>{% endblock %}
