{% extends "base.html" %}{% block content %}<h2>Users & Roles</h2><form method="post" class="card p-3 mb-3"><div class="row g-2"><div class="col"><input name="name" placeholder="Name" class="form-control" required></div><div class="col"><input name="email" type="email" placeholder="Email" class="form-control" required></div><div class="col"><input name="password" placeholder="Password" class="form-control" required></div><div class="col"><select name="role" class="form-select">{% for r in roles %}<option>{{r}}</option>{% endfor %}</select></div><div class="col"><select name="branch_id" class="form-select"><option value="">All / None</option>{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></div></div><button class="btn btn-primary mt-2">Add User</button></form><div class="card p-3"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Branch</th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{{u.branch.name if u.branch else 'All'}}</td></tr>{% endfor %}</table></div>{% endblock %}
