{% extends "base.html" %}{% block content %}<h2>Staff</h2>{% if current_user.role in ['super_admin','branch_admin'] %}<form method="post" class="card p-3 mb-3"><div class="row g-2"><div class="col"><input name="name" placeholder="Name" class="form-control"></div><div class="col"><input name="role_name" placeholder="Role" class="form-control"></div><div class="col"><input name="mobile" placeholder="Mobile" class="form-control"></div><div class="col"><input name="cnic" placeholder="CNIC/ID" class="form-control"></div><div class="col"><input name="salary" type="number" placeholder="Salary" class="form-control"></div><div class="col"><select name="branch_id" class="form-select">{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></div></div><button class="btn btn-primary mt-2">Add Staff</button></form>{% endif %}<table class="table"><tr><th>Name</th><th>Role</th><th>Branch</th><th>Salary</th></tr>{% for s in rows %}<tr><td>{{s.name}}</td><td>{{s.role_name}}</td><td>{{s.branch.name}}</td><td>{{s.salary}}</td></tr>{% endfor %}</table>{% endblock %}
