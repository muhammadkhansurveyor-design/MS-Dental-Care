{% extends "base.html" %}{% block content %}<h2>Credit Patients</h2><div class="card p-3"><table class="table"><tr><th>Invoice</th><th>Patient</th><th>Branch</th><th>Total</th><th>Received</th><th>Balance</th></tr>{% for i in rows %}<tr><td>{{i.invoice_no}}</td><td><a href="{{url_for('patient_detail',pid=i.patient_id)}}">{{i.patient.name}}</a></td><td>{{i.branch.name}}</td><td>{{i.total-i.discount}}</td><td>{{i.received}}</td><td class="text-danger fw-bold">{{i.balance}}</td></tr>{% endfor %}</table></div>{% endblock %}
